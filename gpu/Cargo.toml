# Exact Rust App's GPU module: the macaron surface, drawn with wgpu
# (WebGPU on the web, Metal on iOS and macOS). Loaded after the first pixel.
[package]
name = "exact-rust-app-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Exact Rust App's GPU module: a purple macaron"
publish = false
build = "build.rs"

[lib]
name = "exact_rust_app_gpu"
crate-type = ["cdylib", "rlib"]
test = false
bench = false

[dependencies]
exact-gpu = { path = "../../exact/gpu" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }

[build-dependencies]
exact-gpu-reflect = { path = "../../exact/gpu/reflect" }
